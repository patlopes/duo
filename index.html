<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F3EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meu Bem" />
    <meta name="description" content="As finanças de vocês dois, divididas de um jeito justo." />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <title>Meu Bem</title>
    <script>
      // Applies the saved theme before first paint so dark mode users never see a light flash.
      // Dexie holds the real preference; this copy exists only because Dexie is asynchronous.
      try {
        var t = localStorage.getItem('duo-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
